[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proofstudio"
version = "0.1.0"
description = "A provenance-aware generative media workflow built with Genblaze and Backblaze B2."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.116,<1",
    "genblaze-core==0.3.8",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
b2 = [
    "genblaze-s3==0.3.6",
]
dev = [
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-tmp"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
