services:
  - type: web
    name: proofstudio
    runtime: python
    plan: free
    buildCommand: uv sync --frozen --no-dev --extra b2
    startCommand: uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.14
      - key: UV_VERSION
        value: 0.11.32
      - key: APP_ENV
        value: production
      - key: APP_BASE_URL
        sync: false
      - key: DATA_DIR
        value: /tmp/proofstudio-data
      - key: DEMO_MODE
        value: "false"
      - key: B2_KEY_ID
        sync: false
      - key: B2_APP_KEY
        sync: false
      - key: B2_BUCKET
        sync: false
      - key: B2_REGION
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_MODEL
        value: "@cf/black-forest-labs/flux-2-klein-4b"
      - key: GENERATION_TIMEOUT_SECONDS
        value: "300"
